# Verify the $0 workspace condition in docs/deployment.md BEFORE applying.
# Reproducible configuration for the existing service, not a second service.
# The dashboard-created service needs its GitHub integration/settings configured separately.
services:
  - type: web
    name: kottabos
    runtime: node
    plan: free
    numInstances: 1
    region: oregon
    branch: main
    autoDeployTrigger: checksPass
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MAX_ROOMS
        value: "4"
      - key: RECONNECT_SECONDS
        value: "120"
      - key: COUNTDOWN_MS
        value: "3000"
